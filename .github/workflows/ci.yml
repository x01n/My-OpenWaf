name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Go test
    runs-on: ubuntu-latest
    needs: [frontend-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "::error::Go files are not formatted"
            echo "$files"
            exit 1
          fi

      - name: Check release workflow contract
        run: |
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/release.yml")'
          grep -Fq 'runs-on: $''{{ matrix.runner }}' .github/workflows/release.yml
          test "$(grep -cE '^[[:space:]]+runner:' .github/workflows/release.yml)" -eq 6
          ruby -ryaml -e '
            release = YAML.load_file(".github/workflows/release.yml")
            steps = release.fetch("jobs").values.flat_map { |job| job["steps"] || [] }
            verify = steps.find { |step| step["name"] == "Verify native QuickJS backend" } or abort("missing native QuickJS verification step")
            build = steps.find { |step| step["name"] == "Build binary" } or abort("missing release build step")
            abort("native QuickJS verification must enable cgo") unless verify.dig("env", "CGO_ENABLED") == "1"
            abort("native QuickJS verification must select the QuickJS tag") unless verify.fetch("run", "").include?("go list -tags=quickjs")
            abort("release build must enable cgo") unless build.dig("env", "CGO_ENABLED") == "1"
            abort("release build must select the QuickJS tag") unless build.fetch("run", "").include?("go build -tags=quickjs")
          '
          if grep -Fq "CGO_ENABLED: '0'" .github/workflows/release.yml; then
            echo "::error::Release workflow disables cgo, so QuickJS is replaced by the stub"
            exit 1
          fi
          if ! grep -Eq -- '-tags(=|[[:space:]])+quickjs([[:space:]]|$)' .github/workflows/release.yml; then
            echo "::error::Release workflow does not enable the QuickJS build tag"
            exit 1
          fi
          grep -Fq '//go:build cgo && quickjs' internal/waf/jsplugin/quickjs_cgo.go
          grep -Fq '//go:build !cgo || !quickjs' internal/waf/jsplugin/quickjs_stub.go
          grep -Fq 'Verify native QuickJS backend' .github/workflows/release.yml
          grep -Fq 'quickjs_cgo.go' .github/workflows/release.yml

      - name: Download frontend export
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: internal/core/adminweb/dist

      - name: Run go vet
        run: CGO_ENABLED=1 go vet -tags=quickjs ./...

      - name: Run Go tests
        run: CGO_ENABLED=1 go test -tags=quickjs -v -timeout=30m ./...

  dialect-migration:
    # 在真实 MySQL / PostgreSQL 上跑 AutoMigrate。
    # SQLite 宽容得多，多类 schema 问题只在这两种方言暴露，例如：
    #   - TEXT 列带 DEFAULT（MySQL Error 1101）
    #   - 复合唯一索引键长超过 3072 字节（MySQL Error 1071）
    # 独立作业，不阻塞主测试路径。
    name: DB dialect migration
    runs-on: ubuntu-latest
    needs: [frontend-test]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: citest
          MYSQL_DATABASE: waf
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pcitest --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: citest
          POSTGRES_DB: waf
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend export
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: internal/core/adminweb/dist

      - name: Run dialect migration tests
        env:
          MY_OPENWAF_TEST_MYSQL_DSN: root:citest@tcp(127.0.0.1:3306)/waf?charset=utf8mb4&parseTime=True&loc=Local
          MY_OPENWAF_TEST_POSTGRES_DSN: postgres://postgres:citest@127.0.0.1:5432/waf?sslmode=disable
        run: go test -v -timeout=10m -run TestAutoMigrateOnExternalDialect ./internal/store/

  frontend-test:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build frontend
        run: bun run build

      - name: Upload frontend export
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
          if-no-files-found: error

  full-build:
    name: Full application build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download frontend export
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: internal/core/adminweb/dist

      - name: Build application
        run: |
          go mod tidy
          CGO_ENABLED=1 go build -tags=quickjs -o bin/my-openwaf ./cmd/...

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: my-openwaf-linux-amd64
          path: bin/my-openwaf
          if-no-files-found: error
