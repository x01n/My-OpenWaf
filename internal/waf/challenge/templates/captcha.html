<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.PageTitle}}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,"Helvetica Neue",sans-serif;background:{{.Background}};display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 32px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);padding:48px 40px;max-width:440px;width:92%;text-align:center}
.icon{font-size:48px;margin-bottom:12px;line-height:1.2}
h1{font-size:1.2rem;font-weight:600;color:#334155;margin-bottom:4px}
.sub{color:#64748b;font-size:.875rem;margin-bottom:6px}
.divider{width:48px;height:3px;background:{{.PrimaryColor}};border-radius:2px;margin:16px auto 24px}
.captcha-box{background:#f8fafc;border-radius:12px;padding:16px;margin-bottom:4px;border:1px solid #e2e8f0}
.captcha-box img{max-width:100%;border-radius:8px;display:block;margin:0 auto}
.captcha-stack{display:grid;gap:10px}.captcha-stack .thumb{max-height:84px;object-fit:contain}.slide-thumb{background:#e2e8f0;padding:6px;transition:transform .12s}.rotate-captcha #cap-img{transition:transform .12s}.rotate-captcha .thumb{max-height:120px}.img-wrap{position:relative;width:fit-content;margin:0 auto}.dot{position:absolute;transform:translate(-50%,-50%);border-radius:999px;background:{{.PrimaryColor}};color:#fff;font-size:10px;font-weight:700;padding:2px 6px;box-shadow:0 2px 8px rgba(15,118,110,.35)}.mini{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 10px;color:#64748b;cursor:pointer}input[type=range]{width:100%;accent-color:#14b8a6}
input[type=text]{width:100%;padding:14px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:1rem;margin-top:16px;outline:none;transition:border-color .2s,box-shadow .2s;background:#f8fafc}
input[type=text]:focus{border-color:#14b8a6;box-shadow:0 0 0 3px rgba(20,184,166,.12);background:#fff}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,#14b8a6,#0d9488);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:500;cursor:pointer;margin-top:16px;transition:opacity .2s,transform .1s}
.btn:hover{opacity:.92}.btn:active{transform:scale(.98)}
.rid{color:#94a3b8;font-size:.7rem;margin-top:20px}
.footer{margin-top:20px;padding-top:14px;border-top:1px solid #f1f5f9;font-size:.7rem;color:#94a3b8}.brand-logo{display:block;max-width:64px;max-height:64px;object-fit:contain;margin:0 auto 12px}.brand-name{color:#64748b;font-size:.75rem;margin-bottom:8px}
{{.CustomCSS}}
</style>
</head>
<body>
<div class="card">
{{if .LogoURL}}<img class="brand-logo" src="{{.LogoURL}}" alt="">{{else}}<div class="icon">&#128274;</div>{{end}}
<div class="brand-name">{{.BrandName}}</div>
<h1>{{.PageTitle}}{{if eq .PageTitle "Security Verification"}} / 安全验证{{end}}</h1>
<p class="sub">{{.Subtitle}}</p>
<p class="sub">{{.SubtitleZh}}</p>
<div class="divider"></div>
<div class="captcha-box">
{{if .IsClick}}
<div class="captcha-stack"><div class="img-wrap"><img id="cap-img" src="{{.MasterImg}}" alt="CAPTCHA"></div><img class="thumb" src="{{.ThumbImg}}" alt="target"><button type="button" class="mini" id="clear-clicks">Clear clicks / 清空点击</button></div>
{{else if .IsSlide}}
<div class="captcha-stack"><img src="{{.MasterImg}}" alt="CAPTCHA"><img id="slide-thumb" class="thumb slide-thumb" src="{{.ThumbImg}}" alt="slider"><input type="range" min="0" max="{{.SlideWidth}}" value="0" id="slide-range"></div>
{{else if .IsRotate}}
<div class="captcha-stack rotate-captcha"><img src="{{.MasterImg}}" alt="CAPTCHA"><img id="rotate-thumb" class="thumb" src="{{.ThumbImg}}" alt="target"><input type="range" min="0" max="360" value="0" id="rotate-range"></div>
{{else}}
<img src="{{.MasterImg}}" alt="CAPTCHA">
{{end}}
</div>
<form method="POST" action="/__owaf/captcha/verify">
<input type="hidden" name="__waf_captcha_session" value="{{.SessionID}}">
<input type="hidden" id="cap-type" value="{{.Type}}">
<input type="hidden" id="cap-env" name="__waf_env_fp" value="">
<input type="text" id="cap-answer" name="__waf_captcha_answer" placeholder="{{.Prompt}}" aria-label="{{.InputMode}}" autocomplete="off" autofocus>
<button type="submit" class="btn">{{.SubmitText}}</button>
</form>
<p class="rid">Request ID: {{.RequestID}}</p>
<p id="cap-env-status" style="display:none;color:#ef4444;font-size:.8rem;margin-top:10px"></p>
<script>
(function(){
var type=document.getElementById('cap-type').value;
var answer=document.getElementById('cap-answer');
var img=document.getElementById('cap-img');
if(type==='click'&&img){
  var points=[];
  answer.type='hidden';
  img.addEventListener('click',function(e){
    var r=img.getBoundingClientRect();
    var x=Math.round(((e.clientX-r.left)/r.width)*(img.naturalWidth||r.width));
    var y=Math.round(((e.clientY-r.top)/r.height)*(img.naturalHeight||r.height));
    points.push({x:x,y:y});
    answer.value=JSON.stringify(points);
    var d=document.createElement('span');
    d.className='dot';d.textContent=String(points.length);
    d.style.left=((x/(img.naturalWidth||r.width))*100)+'%';
    d.style.top=((y/(img.naturalHeight||r.height))*100)+'%';
    img.parentNode.appendChild(d);
  });
  var clear=document.getElementById('clear-clicks');
  if(clear){clear.addEventListener('click',function(){points=[];answer.value='';document.querySelectorAll('.dot').forEach(function(n){n.remove();});});}
}
var slide=document.getElementById('slide-range');
var thumb=document.getElementById('slide-thumb');
if(type==='slide'&&slide){
  answer.type='hidden';
  slide.addEventListener('input',function(){answer.value=JSON.stringify({x:Number(slide.value)});if(thumb){thumb.style.transform='translateX('+slide.value+'px)';}});
}
var rotate=document.getElementById('rotate-range');
var rotateThumb=document.getElementById('rotate-thumb');
if(type==='rotate'&&rotate&&rotateThumb){
  answer.type='hidden';
  rotate.addEventListener('input',function(){answer.value=JSON.stringify({angle:Number(rotate.value)});rotateThumb.style.transform='rotate('+rotate.value+'deg)';});
}
var capEnv=document.getElementById('cap-env');
var capForm=answer&&answer.form;
var capStatus=document.getElementById('cap-env-status');
var submitting=false;
function showEnvError(message){
 if(capStatus){capStatus.textContent=message||'Environment verification failed. / 环境验证失败。';capStatus.style.display='block';}
}
window.__owaf_env_error_callback=function(message){showEnvError(message);};
if(capEnv&&capForm){
 capForm.addEventListener('submit',function(event){
  if(submitting||window.__owaf_env_required!==true)return;
  event.preventDefault();
  if(!window.__owaf_env_ready||typeof window.__owaf_env_ready.then!=='function'){
   showEnvError('Environment WASM is unavailable. / 环境 WASM 不可用。');
   return;
  }
  submitting=true;
  var submitButton=capForm.querySelector('button[type=submit]');
  if(submitButton)submitButton.disabled=true;
  window.__owaf_env_ready.then(function(envelope){
   if(!envelope)throw new Error('Environment verification failed');
   capEnv.value=envelope;
   HTMLFormElement.prototype.submit.call(capForm);
  }).catch(function(error){
   submitting=false;
   if(submitButton)submitButton.disabled=false;
   showEnvError((error&&error.message)||'Environment verification failed. / 环境验证失败。');
  });
 });
}
})();
</script>
{{if .EnvJS}}<script>
{{.EnvJS}}
</script>{{end}}
<div class="footer">{{.FooterText}}</div>
</div>
</body>
</html>
